<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE111 Unit 1 — Interactive Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Roboto", -apple-system, "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: #f2f6fb;
            color: #111;
        }

        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .quiz-container h1 {
            text-align: center;
            font-size: 26px;
            letter-spacing: -0.4px;
            margin: 10px 0 20px;
        }

        .quiz-container .timer {
            font-weight: bold;
            text-align: right;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .timer.danger {
            color: red;
        }

        .quiz-container h2.question {
            font-size: 20px;
            background-color: #d0ecff;
            padding: 18px;
            border-radius: 8px;
            font-weight: normal;
            line-height: 1.6;
            margin: 0 0 20px;
        }

        .question-number {
            font-size: 15px;
            margin-right: 12px;
            background: #1d3557;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            white-space: nowrap;
            vertical-align: middle;
        }

        .quiz-container .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .quiz-container .option {
            border: none;
            padding: 22px 24px;
            font-size: 17px;
            background: yellow;
            cursor: pointer;
            border-radius: 6px;
            text-align: left;
            line-height: 1.4;
            color: #222;
            transition: filter .12s;
        }

        .quiz-container .option:hover:not(.disabled) {
            filter: brightness(0.95);
        }

        .disabled {
            pointer-events: none;
            opacity: 0.75;
        }

        .option.correct {
            background-color: #51e351;
            color: #222;
        }

        .option.incorrect {
            background: #e63946;
            color: #fff;
        }

        .fib-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            max-width: 720px;
        }

        .fib-row input {
            flex: 1;
            border: none;
            padding: 20px 22px;
            font-size: 17px;
            background: yellow;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
            color: #222;
        }

        .fib-row input:focus {
            outline: 3px solid #ffd700;
        }

        .fib-row input.correct {
            background: #51e351;
        }

        .fib-row input.incorrect {
            background: #e63946;
            color: #fff;
        }

        .fib-row .fib-submit {
            background: #222;
            color: #fff;
            border: none;
            padding: 12px 26px;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 6px;
        }

        .quiz-container .next-btn,
        .quiz-result .retake-btn {
            background: #222;
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 20px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            width: fit-content;
            display: inline-block;
        }

        .quiz-container .next-btn {
            margin: 0 auto;
            display: block;
        }

        .nav-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            max-width: 760px;
            margin: 0 auto;
        }

        .nav-row .next-btn {
            flex: 1;
            max-width: 300px;
            width: auto;
        }

        .next-btn.prev {
            background: #3a4a5a;
        }

        .next-btn.prev:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- result page ---------- */
        .quiz-result {
            display: none;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            text-align: center;
            color: #dd2e00;
        }

        .quiz-result h2 {
            margin: 6px 0 0;
            font-size: 26px;
        }

        .quiz-result h3 {
            margin: 0;
            color: #1d3557;
            font-size: 20px;
        }

        .result-legend {
            font-size: 14px;
            color: #333;
            display: flex;
            justify-content: center;
            gap: 22px;
            align-items: center;
        }

        .result-legend span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
        }

        .dot.g { background: #51e351; }
        .dot.r { background: #e63946; }

        .question-container {
            text-align: left;
            border: 1.5px solid #dddddd;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
            color: #222;
        }

        .question-container.correct-item {
            background: #2ecc40;
            border: none;
            color: #fff;
        }

        .question-container.incorrect-item {
            background: #e63946;
            border: none;
            color: #fff;
        }

        .question-container .question {
            font-weight: 600;
            line-height: 1.5;
        }

        .question-container .qno {
            background: #1d3557;
            color: #fff;
            padding: 3px 9px;
            border-radius: 7px;
            font-size: 13px;
            margin-right: 8px;
        }

        .question-container .user-answer,
        .question-container .correct-answer {
            color: #fff;
            font-size: 14px;
        }

        .user-answer.good {
            color: #fff;
            font-weight: 700;
        }

        .user-answer.bad {
            color: #fff;
            font-weight: 700;
        }

        .correct-answer {
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }

        .quiz-result .retake-btn {
            margin: 10px auto;
        }

        footer {
            text-align: center;
            color: #7c8a99;
            font-size: 12px;
            padding-bottom: 20px;
        }

        @media (max-width: 700px) {
            .quiz-container .options {
                grid-template-columns: 1fr;
            }
            .fib-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>CSE111 · Unit 1: Computing Environment</h1>
    <div class="timer">Time Left: 00:00</div>
    <h2 class="question"></h2>
    <div class="options"></div>
    <div class="fib-row hidden" id="fibRow">
        <input type="text" id="fibInput" placeholder="Type your answer here…" autocomplete="off">
        <button class="fib-submit" id="fibSubmit">Check</button>
    </div>
    <div class="nav-row">
        <button class="next-btn prev" id="prevBtn">Previous</button>
        <button class="next-btn" id="nextBtn">Next</button>
    </div>
</div>

<div class="quiz-result"></div>

<footer>CSE111 · Unit 1: Computing Environment — 400-question interactive bank</footer>

<script>
const QUESTIONS = [{"n":1,"t":"The entity that acts as an intermediary bridge between the user and raw computer hardware is the:","type":"mc","opts":[{"l":"A","t":"Compiler"},{"l":"B","t":"Operating System"},{"l":"C","t":"Linker"},{"l":"D","t":"Assembler"}],"ans":"B","anst":"Operating System"},{"n":2,"t":"In the air-traffic controller analogy, what represents the planes waiting for runway clearance?","type":"mc","opts":[{"l":"A","t":"Data packets"},{"l":"B","t":"Operating systems"},{"l":"C","t":"Applications and hardware components"},{"l":"D","t":"Cloud hypervisors"}],"ans":"C","anst":"Applications and hardware components"},{"n":3,"t":"What would occur if an application attempted to run without an operating system?","type":"mc","opts":[{"l":"A","t":"It would execute faster via native BIOS"},{"l":"B","t":"It would need to speak directly to hardware without shared screens or file systems"},{"l":"C","t":"Multitasking would be handled by CPU microcode"},{"l":"D","t":"The system defaults to an automatic shell"}],"ans":"B","anst":"It would need to speak directly to hardware without shared screens or file systems"},{"n":4,"t":"Managing CPU time allocation among competing processes is the core job of:","type":"mc","opts":[{"l":"A","t":"Process Management"},{"l":"B","t":"Device Management"},{"l":"C","t":"Memory Management"},{"l":"D","t":"Network Access"}],"ans":"A","anst":"Process Management"},{"n":5,"t":"Which subsystem prevents two separate programs from colliding or overwriting each other in RAM?","type":"mc","opts":[{"l":"A","t":"File Management"},{"l":"B","t":"Memory Management"},{"l":"C","t":"Process Scheduling"},{"l":"D","t":"User Isolation"}],"ans":"B","anst":"Memory Management"},{"n":6,"t":"What allows an OS to communicate with peripherals like printers, displays, and keyboards?","type":"mc","opts":[{"l":"A","t":"Hypervisors"},{"l":"B","t":"Compilers"},{"l":"C","t":"Device Drivers"},{"l":"D","t":"Sockets"}],"ans":"C","anst":"Device Drivers"},{"n":7,"t":"Organizing binary storage blocks into files and directory trees is handled by:","type":"mc","opts":[{"l":"A","t":"Security Management"},{"l":"B","t":"File Management"},{"l":"C","t":"Network Management"},{"l":"D","t":"Process Management"}],"ans":"B","anst":"File Management"},{"n":8,"t":"Which function enforces authentication, credentials, and user privilege isolation?","type":"mc","opts":[{"l":"A","t":"Security & Access Control"},{"l":"B","t":"Process Management"},{"l":"C","t":"UI Layer"},{"l":"D","t":"BIOS"}],"ans":"A","anst":"Security & Access Control"},{"n":9,"t":"What are the two primary types of User Interfaces provided by modern operating systems?","type":"mc","opts":[{"l":"A","t":"API and ABI"},{"l":"B","t":"GUI and Command Line"},{"l":"C","t":"TCP and UDP"},{"l":"D","t":"POSIX and ANSI"}],"ans":"B","anst":"GUI and Command Line"},{"n":10,"t":"When an app icon is clicked, what does the OS do first?","type":"mc","opts":[{"l":"A","t":"Allocates RAM"},{"l":"B","t":"Locates the program file on disk"},{"l":"C","t":"Draws the GUI window"},{"l":"D","t":"Assigns CPU priority"}],"ans":"B","anst":"Locates the program file on disk"},{"n":11,"t":"What step occurs directly after the memory manager allocates RAM during application launch?","type":"mc","opts":[{"l":"A","t":"Process manager schedules it on the CPU"},{"l":"B","t":"OS searches disk storage"},{"l":"C","t":"User authentication is verified"},{"l":"D","t":"Display driver initializes GPU memory"}],"ans":"A","anst":"Process manager schedules it on the CPU"},{"n":12,"t":"In which OS architecture are jobs batched and executed sequentially without interactive user control?","type":"mc","opts":[{"l":"A","t":"Time-Sharing OS"},{"l":"B","t":"Batch OS"},{"l":"C","t":"Distributed OS"},{"l":"D","t":"Real-Time OS"}],"ans":"B","anst":"Batch OS"},{"n":13,"t":"Which of the following is an example of a Batch Operating System?","type":"mc","opts":[{"l":"A","t":"FreeRTOS"},{"l":"B","t":"IBM OS/360 / z/OS"},{"l":"C","t":"Ubuntu Desktop"},{"l":"D","t":"Android"}],"ans":"B","anst":"IBM OS/360 / z/OS"},{"n":14,"t":"What primary mechanism allows a Time-Sharing OS to support multiple users simultaneously?","type":"mc","opts":[{"l":"A","t":"Running code without memory allocation"},{"l":"B","t":"Rapid CPU switching between tasks"},{"l":"C","t":"Manual queue management"},{"l":"D","t":"Dedicated hardware threads per user"}],"ans":"B","anst":"Rapid CPU switching between tasks"},{"n":15,"t":"UNIX, Linux, and Multics are classic examples of which OS category?","type":"mc","opts":[{"l":"A","t":"Batch OS"},{"l":"B","t":"Time-Sharing OS"},{"l":"C","t":"Single-User DOS"},{"l":"D","t":"Hard Real-Time OS"}],"ans":"B","anst":"Time-Sharing OS"},{"n":16,"t":"Which OS makes a network of distinct computers appear to the end-user as a single unified machine?","type":"mc","opts":[{"l":"A","t":"Distributed OS"},{"l":"B","t":"Mobile OS"},{"l":"C","t":"Time-Sharing OS"},{"l":"D","t":"RTOS"}],"ans":"A","anst":"Distributed OS"},{"n":17,"t":"Plan 9 from Bell Labs, Amoeba, and Google Fuchsia are examples of:","type":"mc","opts":[{"l":"A","t":"Batch systems"},{"l":"B","t":"Distributed operating systems"},{"l":"C","t":"Embedded microcontroller monitors"},{"l":"D","t":"Virtual machine managers"}],"ans":"B","anst":"Distributed operating systems"},{"n":18,"t":"What is the fundamental design constraint of a Real-Time Operating System (RTOS)?","type":"mc","opts":[{"l":"A","t":"Guaranteed execution within strict time limits"},{"l":"B","t":"Maximum graphic frame rates"},{"l":"C","t":"Battery optimization for smartphones"},{"l":"D","t":"Unlimited memory allocation"}],"ans":"A","anst":"Guaranteed execution within strict time limits"},{"n":19,"t":"Which critical device requires an RTOS?","type":"mc","opts":[{"l":"A","t":"Web server"},{"l":"B","t":"Car airbag controller / Pacemaker"},{"l":"C","t":"Video streaming server"},{"l":"D","t":"Laptop word processor"}],"ans":"B","anst":"Car airbag controller / Pacemaker"},{"n":20,"t":"FreeRTOS, VxWorks, and QNX are classified as:","type":"mc","opts":[{"l":"A","t":"Distributed Operating Systems"},{"l":"B","t":"Real-Time Operating Systems"},{"l":"C","t":"Batch Processing Systems"},{"l":"D","t":"Desktop Operating Systems"}],"ans":"B","anst":"Real-Time Operating Systems"},{"n":21,"t":"Mobile operating systems like Android and iOS are specifically optimized for:","type":"mc","opts":[{"l":"A","t":"Batch card reading"},{"l":"B","t":"Touch, battery life, and app ecosystems"},{"l":"C","t":"Distributed clustering"},{"l":"D","t":"Deterministic industrial robotics"}],"ans":"B","anst":"Touch, battery life, and app ecosystems"},{"n":22,"t":"Over 96% of the world's top 1 million web servers run on:","type":"mc","opts":[{"l":"A","t":"Windows Server"},{"l":"B","t":"Linux"},{"l":"C","t":"macOS"},{"l":"D","t":"Solaris"}],"ans":"B","anst":"Linux"},{"n":23,"t":"The entire Linux file system branches from a single root denoted by:","type":"mc","opts":[{"l":"A","t":"C:\\"},{"l":"B","t":"/"},{"l":"C","t":"/root"},{"l":"D","t":"~"}],"ans":"B","anst":"/"},{"n":24,"t":"Which Linux directory contains essential command binaries like ls and cp?","type":"mc","opts":[{"l":"A","t":"/bin"},{"l":"B","t":"/etc"},{"l":"C","t":"/home"},{"l":"D","t":"/var"}],"ans":"A","anst":"/bin"},{"n":25,"t":"In Linux, machine-wide configuration files are stored inside:","type":"mc","opts":[{"l":"A","t":"/sys"},{"l":"B","t":"/etc"},{"l":"C","t":"/usr"},{"l":"D","t":"/opt"}],"ans":"B","anst":"/etc"},{"n":26,"t":"Where are personal folders and profiles for regular non-root users stored by default?","type":"mc","opts":[{"l":"A","t":"/root"},{"l":"B","t":"/home"},{"l":"C","t":"/var/users"},{"l":"D","t":"/usr/home"}],"ans":"B","anst":"/home"},{"n":27,"t":"Variable system runtime files such as log output and caches are stored in:","type":"mc","opts":[{"l":"A","t":"/tmp"},{"l":"B","t":"/var"},{"l":"C","t":"/bin"},{"l":"D","t":"/dev"}],"ans":"B","anst":"/var"},{"n":28,"t":"The dedicated home directory for the administrator (superuser) is:","type":"mc","opts":[{"l":"A","t":"/home/root"},{"l":"B","t":"/root"},{"l":"C","t":"/"},{"l":"D","t":"/admin"}],"ans":"B","anst":"/root"},{"n":29,"t":"Installed software programs and libraries are located within:","type":"mc","opts":[{"l":"A","t":"/usr"},{"l":"B","t":"/etc"},{"l":"C","t":"/var"},{"l":"D","t":"/bin"}],"ans":"A","anst":"/usr"},{"n":30,"t":"Which command shows the folder you are currently in?","type":"mc","opts":[{"l":"A","t":"ls"},{"l":"B","t":"pwd"},{"l":"C","t":"cd"},{"l":"D","t":"dir"}],"ans":"B","anst":"pwd"},{"n":31,"t":"To see a listing of files and folders inside your current directory, run:","type":"mc","opts":[{"l":"A","t":"ls"},{"l":"B","t":"cat"},{"l":"C","t":"pwd"},{"l":"D","t":"touch"}],"ans":"A","anst":"ls"},{"n":32,"t":"What command changes your current folder in the terminal?","type":"mc","opts":[{"l":"A","t":"mv"},{"l":"B","t":"cd"},{"l":"C","t":"pwd"},{"l":"D","t":"ls"}],"ans":"B","anst":"cd"},{"n":33,"t":"Which command creates a new folder in Linux?","type":"mc","opts":[{"l":"A","t":"touch"},{"l":"B","t":"mkdir"},{"l":"C","t":"rmdir"},{"l":"D","t":"cat"}],"ans":"B","anst":"mkdir"},{"n":34,"t":"The command rmdir deletes:","type":"mc","opts":[{"l":"A","t":"Any directory recursively"},{"l":"B","t":"An empty folder"},{"l":"C","t":"Individual hidden files"},{"l":"D","t":"Corrupted partitions"}],"ans":"B","anst":"An empty folder"},{"n":35,"t":"To create a blank new file named script.py, type:","type":"mc","opts":[{"l":"A","t":"touch script.py"},{"l":"B","t":"mkdir script.py"},{"l":"C","t":"cat script.py"},{"l":"D","t":"chmod script.py"}],"ans":"A","anst":"touch script.py"},{"n":36,"t":"Which command copies files or folders from one location to another?","type":"mc","opts":[{"l":"A","t":"mv"},{"l":"B","t":"cp"},{"l":"C","t":"touch"},{"l":"D","t":"rm"}],"ans":"B","anst":"cp"},{"n":37,"t":"The mv command is used to:","type":"mc","opts":[{"l":"A","t":"Move or rename a file"},{"l":"B","t":"Clone partitions"},{"l":"C","t":"Modify timestamps"},{"l":"D","t":"Concatenate outputs"}],"ans":"A","anst":"Move or rename a file"},{"n":38,"t":"Which command deletes a file?","type":"mc","opts":[{"l":"A","t":"rm"},{"l":"B","t":"rmdir"},{"l":"C","t":"deldir"},{"l":"D","t":"erase"}],"ans":"A","anst":"rm"},{"n":39,"t":"To display a file's contents directly to the console, execute:","type":"mc","opts":[{"l":"A","t":"view"},{"l":"B","t":"cat"},{"l":"C","t":"echo"},{"l":"D","t":"show"}],"ans":"B","anst":"cat"},{"n":40,"t":"Which command changes file permissions in Linux?","type":"mc","opts":[{"l":"A","t":"chown"},{"l":"B","t":"chmod"},{"l":"C","t":"touch"},{"l":"D","t":"cp"}],"ans":"B","anst":"chmod"},{"n":41,"t":"What does the command chmod +x app.py accomplish?","type":"mc","opts":[{"l":"A","t":"Deletes app.py"},{"l":"B","t":"Grants execute permission to app.py"},{"l":"C","t":"Opens app.py in edit mode"},{"l":"D","t":"Marks app.py as hidden"}],"ans":"B","anst":"Grants execute permission to app.py"},{"n":42,"t":"Two or more interconnected computers configured to exchange data and share resources constitute a:","type":"mc","opts":[{"l":"A","t":"File system"},{"l":"B","t":"Computer Network"},{"l":"C","t":"Hypervisor"},{"l":"D","t":"Database"}],"ans":"B","anst":"Computer Network"},{"n":43,"t":"Which network class covers personal devices within a span of a few meters?","type":"mc","opts":[{"l":"A","t":"LAN"},{"l":"B","t":"PAN"},{"l":"C","t":"MAN"},{"l":"D","t":"WAN"}],"ans":"B","anst":"PAN"},{"n":44,"t":"Connecting wireless earbuds to a smartphone via Bluetooth forms a:","type":"mc","opts":[{"l":"A","t":"MAN"},{"l":"B","t":"PAN"},{"l":"C","t":"WAN"},{"l":"D","t":"LAN"}],"ans":"B","anst":"PAN"},{"n":45,"t":"A network contained within a single building or college computer lab is a:","type":"mc","opts":[{"l":"A","t":"LAN"},{"l":"B","t":"WAN"},{"l":"C","t":"PAN"},{"l":"D","t":"MAN"}],"ans":"A","anst":"LAN"},{"n":46,"t":"A network covering an entire city (such as a cable TV or traffic-camera network) is a:","type":"mc","opt nly for the cloud resources you consume is known as:","type":"mc","opts":[{"l":"A","t":"Broad Network Access"},{"l":"B","t":"Measured Service"},{"l":"C","t":"On-Demand Provisioning"},{"l":"D","t":"Multi-Tenancy"}],"ans":"B","anst":"Measured Service"},{"n":262,"t":"An infrastructure open to anyone and operated by providers like AWS or Google Cloud is a:","type":"mc","opts":[{"l":"A","t":"Private Cloud"},{"l":"B","t":"Public Cloud"},{"l":"C","t":"Community Cloud"},{"l":"D","t":"Hybrid Cloud"}],"ans":"B","anst":"Public Cloud"},{"n":263,"t":"A cloud infrastructure built and operated exclusively for a single organization is a:","type":"mc","opts":[{"l":"A","t":"Public Cloud"},{"l":"B","t":"Private Cloud"},{"l":"C","t":"Hybrid Cloud"},{"l":"D","t":"Community Cloud"}],"ans":"B","anst":"Private Cloud"},{"n":264,"t":"Combining a private on-premises cloud for sensitive data with public cloud servers for consumer apps forms a:","type":"mc","opts":[{"l":"A","t":"Community Cloud"},{"l":"B","t":"Hybrid Cloud"},{"l":"C","t":"Public Mesh"},{"l":"D","t":"Peer-to-Peer Cloud"}],"ans":"B","anst":"Hybrid Cloud"},{"n":265,"t":"Which cloud deployment model is shared by organizations with common security and mission needs?","type":"mc","opts":[{"l":"A","t":"Public Cloud"},{"l":"B","t":"Community Cloud"},{"l":"C","t":"Private Cloud"},{"l":"D","t":"Hybrid Cloud"}],"ans":"B","anst":"Community Cloud"},{"n":266,"t":"In the \"Pizza as a Service\" analogy, making pizza at home from scratch corresponds to:","type":"mc","opts":[{"l":"A","t":"SaaS"},{"l":"B","t":"On-Premises"},{"l":"C","t":"PaaS"},{"l":"D","t":"IaaS"}],"ans":"B","anst":"On-Premises"},{"n":267,"t":"Under Infrastructure as a Service (IaaS), which component is the customer's responsibility?","type":"mc","opts":[{"l":"A","t":"Physical server hardware"},{"l":"B","t":"Operating System, runtime, middleware, data, and applications"},{"l":"C","t":"Data center cooling"},{"l":"D","t":"Physical hypervisor maintenance"}],"ans":"B","anst":"Operat :396,"t":"True/False: In a Star topology, if the central hub or switch fails, the entire network connected to it goes down.","type":"tf","ans":"True","anst":"True"},{"n":397,"t":"True/False: The Linux file tree begins with drive letters such as C: or D:.","type":"tf","ans":"False","anst":"False"},{"n":398,"t":"True/False: Broad Network Access allows cloud capabilities to be accessed over standard networks across various client devices.","type":"tf","ans":"True","anst":"True"},{"n":399,"t":"True/False: An Access Point connects wireless devices to an existing wired network.","type":"tf","ans":"True","anst":"True"},{"n":400,"t":"True/False: Under Software as a Service (SaaS), the end-user customer is responsible for managing hypervisors and runtime libraries.","type":"tf","ans":"False","anst":"False"}];

const quizContainer = document.querySelector(".quiz-container");
const resultContainer = document.querySelector(".quiz-result");
const timerDisplay = document.querySelector(".quiz-container .timer");
const questionEl = document.querySelector(".quiz-container .question");
const optionsEl = document.querySelector(".quiz-container .options");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const fibRow = document.getElementById("fibRow");
const fibInput = document.getElementById("fibInput");
const fibSubmit = document.getElementById("fibSubmit");

const MAX_QUESTIONS = QUESTIONS.length;
const SECONDS_PER_QUESTION = 25;
const TEST_DURATION = MAX_QUESTIONS * SECONDS_PER_QUESTION;

let active = [];
let questionNumber = 0;
let score = 0;
let timeLeft = 0;
let timerInterval;

const shuffleArray = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

const resetLocalStorage = () => {
    for (let i = 0; i < MAX_QUESTIONS; i++) {
        localStorage.removeItem(`userAnswer_${i}`);
    }
};

function correctText(q) {
    if (q.type === "mc") {
        const o = q.opts.find(x => x.l === q.ans);
        return o ? o.t : q.anst;
    }
    if (q.type === "tf") return q.ans;
    return q.anst;
}

function fibMatch(input, ans) {
    const ni = norm(input);
    if (!ni) return false;
    const candidates = [ans, ans.replace(/\([^)]*\)/g, "").trim()];
    ans.split(/[;,]/).forEach(p => {
        const t = p.trim().replace(/\([^)]*\)/g, "").trim();
        if (t) candidates.push(t);
    });
    return candidates.some(c => c && norm(c) === ni);
}
function norm(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function isCorrect(q, userText) {
    if (!userText) return false;
    const t = String(userText).trim();
    if (q.type === "fib") return fibMatch(t, q.anst);
    return t === correctText(q);
}

const formatTime = seconds => {
    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
};

const updateTimerDisplay = () => {
    timerDisplay.textContent = `Time Left: ${formatTime(timeLeft)}`;
    timerDisplay.classList.toggle("danger", timeLeft <= 300);
};

const startTestTimer = () => {
    clearInterval(timerInterval);
    timeLeft = TEST_DURATION;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            displayQuizResult();
            return;
        }
        updateTimerDisplay();
    }, 1000);
};

function checkAnswer(userAnswer, el) {
    const q = active[questionNumber];
    const correct = correctText(q);
    const ok = isCorrect(q, userAnswer);

    if (ok) {
        score++;
        el.classList.add("correct");
    } else {
        el.classList.add("incorrect");
    }

    localStorage.setItem(`userAnswer_${questionNumber}`, String(userAnswer).trim());

    const allOptions = document.querySelectorAll(".quiz-container .option");
    allOptions.forEach(o => o.classList.add("disabled"));
    fibInput.disabled = true;
    fibSubmit.disabled = true;

    if (!ok) {
        allOptions.forEach(o => {
            if (o.textContent.trim() === correct) o.classList.add("correct");
        });
    }
}

function buildOptions(q, savedUser) {
    optionsEl.innerHTML = "";
    fibRow.classList.add("hidden");
    optionsEl.classList.remove("hidden");

    const correct = correctText(q);
    const locked = savedUser != null;
    const qs = q.type === "tf" ? ["True", "False"] : q.opts.map(o => o.t);

    qs.forEach(o => {
        const option = document.createElement("button");
        option.classList.add("option");
        option.textContent = o;
        if (locked) {
            option.classList.add("disabled");
            if (o === correct) option.classList.add("correct");
            if (o === String(savedUser).trim() && o !== correct) option.classList.add("incorrect");
        } else {
            option.addEventListener("click", () => checkAnswer(o, option));
        }
        optionsEl.appendChild(option);
    });
}

function buildFib(q, savedUser) {
    optionsEl.classList.add("hidden");
    fibRow.classList.remove("hidden");
    fibInput.classList.remove("correct", "incorrect");
    fibInput.value = savedUser != null ? savedUser : "";

    if (savedUser != null) {
        fibInput.disabled = true;
        fibSubmit.disabled = true;
        fibInput.classList.add(isCorrect(q, savedUser) ? "correct" : "incorrect");
    } else {
        fibInput.disabled = false;
        fibSubmit.disabled = false;
        fibInput.focus();
    }
}

function createQuestion() {
    optionsEl.innerHTML = "";
    const q = active[questionNumber];
    const savedUser = localStorage.getItem(`userAnswer_${questionNumber}`);
    const tq = q.t.replace(/^True\/False:\s*/, "");
    questionEl.innerHTML = `<span class="question-number">${questionNumber + 1}/${MAX_QUESTIONS}</span> ${tq}`;

    if (q.type === "fib") {
        buildFib(q, savedUser);
    } else {
        buildOptions(q, savedUser);
    }

    nextBtn.textContent = questionNumber >= MAX_QUESTIONS - 1 ? "Finish" : "Next";
    prevBtn.disabled = questionNumber === 0;
}

fibSubmit.addEventListener("click", () => {
    if (!fibInput.disabled) {
        const val = fibInput.value.trim();
        if (!val) { fibInput.focus(); return; }
        checkAnswer(val, fibInput);
        if (isCorrect(active[questionNumber], val)) fibInput.classList.add("correct");
        else fibInput.classList.add("incorrect");
    }
});
fibInput.addEventListener("keydown", e => {
    if (e.key === "Enter") fibSubmit.click();
});

const displayNextQuestion = () => {
    if (questionNumber >= MAX_QUESTIONS - 1) {
        displayQuizResult();
        return;
    }
    questionNumber++;
    createQuestion();
};
nextBtn.addEventListener("click", displayNextQuestion);

const displayPrevQuestion = () => {
    if (questionNumber > 0) {
        questionNumber--;
        createQuestion();
    }
};
prevBtn.addEventListener("click", displayPrevQuestion);

const getResultMessage = () => {
    const pct = score / MAX_QUESTIONS;
    if (pct === 1) return "Outstanding! Perfect score.";
    if (pct >= 0.75) return "Very good.";
    if (pct >= 0.5) return "Good. Keep practising the weak spots.";
    if (pct >= 0.25) return "Do hard work — revisit the review list below.";
    return "Better luck next time.";
};

const displayQuizResult = () => {
    clearInterval(timerInterval);
    resultContainer.style.display = "flex";
    quizContainer.style.display = "none";
    resultContainer.innerHTML = "";

    const heading = document.createElement("h2");
    heading.innerHTML = `You have scored ${score} out of ${MAX_QUESTIONS}.`;
    resultContainer.appendChild(heading);

    const msg = document.createElement("h3");
    msg.innerHTML = getResultMessage();
    resultContainer.appendChild(msg);

    const legend = document.createElement("div");
    legend.className = "result-legend";
    legend.innerHTML = '<span><span class="dot g"></span> Correct</span><span><span class="dot r"></span> Wrong / Not answered</span>';
    resultContainer.appendChild(legend);

    for (let i = 0; i < MAX_QUESTIONS; i++) {
        const q = active[i];
        const userAnswer = localStorage.getItem(`userAnswer_${i}`);
        const ok = isCorrect(q, userAnswer);

        const item = document.createElement("div");
        item.classList.add("question-container");
        item.classList.add(ok ? "correct-item" : "incorrect-item");

        const showQ = q.t.replace(/^True\/False:\s*/, "");
        const userText = userAnswer && userAnswer.trim() ? userAnswer.trim() : "Not answered";

        item.innerHTML = `
            <div class="question"><span class="qno">Q${q.n}</span>${showQ}</div>
            <div class="user-answer ${ok ? "good" : "bad"}">Your answer: ${userText}</div>
            <div class="correct-answer">Correct answer: ${correctText(q)}</div>`;

        resultContainer.appendChild(item);
    }

    const retakeBtn = document.createElement("button");
    retakeBtn.classList.add("retake-btn");
    retakeBtn.innerHTML = "Retake Quiz";
    retakeBtn.addEventListener("click", retakeQuiz);
    resultContainer.appendChild(retakeBtn);

    window.scrollTo({ top: 0 });
};

const retakeQuiz = () => {
    questionNumber = 0;
    score = 0;
    active = shuffleArray(active);
    resetLocalStorage();

    startTestTimer();
    createQuestion();
    resultContainer.style.display = "none";
    quizContainer.style.display = "block";
    window.scrollTo({ top: 0 });
};

active = shuffleArray(QUESTIONS);
resetLocalStorage();
startTestTimer();
createQuestion();
</script>
